name: Native Verification

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  LIBOQS_VERSION: "0.15.0"
  LIBOQS_EXPECTED_COMMIT: "97f6b86b1b6d109cfd43cf276ae39c2e776aed80"

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS temporarily disabled — runner hangs at pytest collection phase
        # os: [windows-2025, ubuntu-22.04, macos-15]
        os: [windows-2025, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - name: Install liboqs C library
        uses: ./.github/actions/install-liboqs
        with:
          version: ${{ env.LIBOQS_VERSION }}
          expected-commit: ${{ env.LIBOQS_EXPECTED_COMMIT }}
          install-prefix: ${{ runner.temp }}/_oqs

      - name: Install Ubuntu dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            gir1.2-gtk-3.0 gir1.2-webkit2-4.0 libwebkit2gtk-4.0-37 \
            libgirepository1.0-dev gcc libcairo2-dev pkg-config python3-dev libglib2.0-dev \
            libegl1 libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0

      - name: Run Native Verification parity checks (Windows)
        if: runner.os == 'Windows'
        run: python tools/ci/native_verify.py --profile windows-ci
        env:
          QT_QPA_PLATFORM: offscreen
          CI: "true"

      - name: Run Native Verification parity checks (Linux)
        if: runner.os == 'Linux'
        run: python tools/ci/native_verify.py --profile linux-ci
        env:
          QT_QPA_PLATFORM: offscreen
          CI: "true"
