name: Build & Release
# <!-- paracci-update: {"protocol_version": 4} -->

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  LIBOQS_VERSION: "0.15.0"
  LIBOQS_EXPECTED_COMMIT: "97f6b86b1b6d109cfd43cf276ae39c2e776aed80"

# ─────────────────────────────────────────────────────────────────────────────
# Triggers:
#   • Push a tag like v1.2.3  → full build + GitHub Release + VT scan
#   • workflow_dispatch        → manual trigger (build artifacts only)
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write      # create GitHub Releases, update release body
  id-token: write      # GitHub OIDC → Sigstore build attestation (SLSA)
  attestations: write  # store build provenance attestation

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1 — Test gate on all three platforms
  # ═══════════════════════════════════════════════════════════════════════════
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # macOS temporarily disabled — runner hangs at pytest collection phase
        # os: [ubuntu-22.04, macos-latest, windows-2025]
        os: [ubuntu-22.04, windows-2025]

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node dependencies and build frontend
        run: |
          npm ci
          npm run build

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linux test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            gir1.2-gtk-3.0 gir1.2-webkit2-4.0 libwebkit2gtk-4.0-37 \
            libgirepository1.0-dev gcc libcairo2-dev pkg-config python3-dev libglib2.0-dev \
            libegl1 libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0

      - name: Install liboqs C library
        uses: ./.github/actions/install-liboqs
        with:
          version: ${{ env.LIBOQS_VERSION }}
          expected-commit: ${{ env.LIBOQS_EXPECTED_COMMIT }}
          install-prefix: ${{ runner.temp }}/_oqs

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --require-hashes -r requirements-dev.lock

      - name: Audit locked dependencies
        run: python -m pip_audit -r requirements.lock -r requirements-dev.lock

      - name: Run tests
        run: python -m pytest paracci/tests -q
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Run clipboard JavaScript tests
        run: node --test paracci/tests/test_session_clipboard.mjs

      - name: Install Playwright Chromium
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi

      - name: Run Python runtime browser console smoke
        run: node tools/ci/browser_console_smoke.mjs --python python
        env:
          QT_QPA_PLATFORM: offscreen
          CI: "true"

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2 — Build on all three platforms in parallel
  # ═══════════════════════════════════════════════════════════════════════════
  build:
    name: Build (${{ matrix.platform_id }})
    needs: [verify]
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform_id: windows
            artifact_name: Paracci-Windows

          # macOS temporarily disabled — runner hangs at pytest collection phase
          # - os: macos-latest
          #   platform_id: macos
          #   artifact_name: Paracci-macOS

          - os: ubuntu-22.04
            platform_id: linux
            artifact_name: Paracci-Linux

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      # ── 2. Set up Python ───────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ── 3. Linux: GTK3 + WebKit2GTK system packages ────────────────────────
      - name: Set up Node.js for Windows packaged browser smoke
        if: runner.os == 'Windows'
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            python3-gi python3-gi-cairo \
            gir1.2-gtk-3.0 gir1.2-webkit2-4.0 libwebkit2gtk-4.0-37 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            libgirepository1.0-dev gcc libcairo2-dev \
            pkg-config python3-dev libglib2.0-dev \
            libegl1 libxcb-cursor0 libxcb-xinerama0 \
            dpkg desktop-file-utils shared-mime-info xvfb zip

      - name: Download pinned Linux packaging tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -fsSLo "$RUNNER_TEMP/appimagetool.AppImage" \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage"
          echo "46fdd785094c7f6e545b61afcfb0f3d98d8eab243f644b4b17698c01d06083d1  $RUNNER_TEMP/appimagetool.AppImage" | sha256sum -c -

          curl -fsSLo "$RUNNER_TEMP/runtime-x86_64" \
            "https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64"
          echo "a2419dce47568395ae79c01ffa9a5a341dd339581352ff104d073527543177e5  $RUNNER_TEMP/runtime-x86_64" | sha256sum -c -

          chmod +x "$RUNNER_TEMP/appimagetool.AppImage"
          {
            echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool.AppImage"
            echo "APPIMAGE_RUNTIME_FILE=$RUNNER_TEMP/runtime-x86_64"
          } >> "$GITHUB_ENV"

      - name: Install liboqs C library
        id: liboqs
        uses: ./.github/actions/install-liboqs
        with:
          version: ${{ env.LIBOQS_VERSION }}
          expected-commit: ${{ env.LIBOQS_EXPECTED_COMMIT }}
          install-prefix: ${{ runner.temp }}/_oqs

      # ── 4. Install runtime + build dependencies ────────────────────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock

      # macOS temporarily disabled — runner hangs at pytest collection phase
      # - name: Install PyInstaller (Standard for macOS)
      #   if: runner.os == 'macOS'
      #   run: |
      #     python -m pip install --require-hashes -r requirements-dev.lock

      - name: Install PyInstaller (Compile from Source for Windows and Linux to eliminate False Positives)
        if: runner.os != 'macOS'
        run: |
          python -m pip install --require-hashes --no-binary pyinstaller -r requirements-dev.lock

      - name: Audit locked dependencies
        run: python -m pip_audit -r requirements.lock -r requirements-dev.lock

      - name: Install Inno Setup 6.7.1
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --no-progress -y

      - name: Verify canonical release metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          IS_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path

          version = Path("VERSION").read_text(encoding="ascii").strip()
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit(f"VERSION must contain MAJOR.MINOR.PATCH, got {version!r}")
          tag = os.environ["RELEASE_TAG"]
          if os.environ["IS_RELEASE_TAG"] == "true" and tag != f"v{version}":
              raise SystemExit(f"Release tag {tag!r} does not match canonical VERSION v{version}.")
          build_info = Path("paracci/app/build_info.py").read_text(encoding="utf-8")
          protocol_match = re.search(r"SESSION_PROTOCOL_VERSION\s*=\s*(\d+)", build_info)
          if not protocol_match:
              raise SystemExit("SESSION_PROTOCOL_VERSION is missing from build_info.py")
          marker = f'<!-- paracci-update: {{"protocol_version": {protocol_match.group(1)}}} -->'
          workflow = Path(".github/workflows/release.yml").read_text(encoding="utf-8")
          if marker not in workflow:
              raise SystemExit(f"Release protocol marker is not synchronized: {marker}")
          print(f"Verified canonical Paracci version {version}")
          PY

      # ── 5. Build executable ────────────────────────────────────────────────
      - name: Build executable and installer (Windows)
        if: runner.os == 'Windows'
        run: python build.py --clean --installer
        env:
          QT_QPA_PLATFORM: offscreen

      # macOS temporarily disabled — runner hangs at pytest collection phase
      # - name: Build executable and DMG (macOS)
      #   if: runner.os == 'macOS'
      #   run: python build.py --clean --dmg
      #   env:
      #     QT_QPA_PLATFORM: offscreen

      - name: Build executable, AppImage, and Debian package (Linux)
        if: runner.os == 'Linux'
        run: python build.py --clean --appimage --deb
        env:
          QT_QPA_PLATFORM: offscreen   # suppress headless Qt warnings on Linux CI

      - name: Install Playwright Chromium for Windows packaged browser smoke
        if: runner.os == 'Windows'
        run: npx playwright install chromium

      - name: Smoke test packaged browser console (Windows executable)
        if: runner.os == 'Windows'
        run: node tools/ci/browser_console_smoke.mjs --runtime executable --executable builds/windows/Paracci/Paracci.exe
        env:
          QT_QPA_PLATFORM: offscreen
          CI: "true"

      - name: Smoke test packaged ML-KEM
        shell: bash
        run: python tools/ci/packaged_runtime_smoke.py --platform "$RUNNER_OS"

      # ── 6. Normalize output path and compute SHA-256 ───────────────────────
      - name: Validate Linux distribution packages
        if: runner.os == 'Linux'
        run: python tools/ci/release_artifact_validation.py validate-build --platform linux --native-ci-checks

      # macOS temporarily disabled — runner hangs at pytest collection phase
      # - name: Validate macOS DMG
      #   if: runner.os == 'macOS'
      #   shell: bash
      #   run: |
      #     set -euo pipefail
      #     dmgs=(builds/macos/Paracci-*-macOS.dmg)
      #     [ "${#dmgs[@]}" -eq 1 ] && [ -f "${dmgs[0]}" ]
      #     hdiutil verify "${dmgs[0]}"

      - name: Prepare asset (Windows)
        if: runner.os == 'Windows'
        run: python tools/ci/release_artifact_validation.py prepare-build-assets --platform windows

      - name: Smoke test packaged browser console (Windows portable ZIP)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = Get-ChildItem -LiteralPath builds/windows -Filter 'Paracci-Portable-v*.zip' | Select-Object -First 1
          if (-not $zip) { throw "Windows portable ZIP not found." }
          node tools/ci/browser_console_smoke.mjs --runtime portable-zip --zip $zip.FullName --python python
        env:
          QT_QPA_PLATFORM: offscreen
          CI: "true"

      - name: Prepare asset (macOS)
        if: runner.os == 'macOS'
        run: python tools/ci/release_artifact_validation.py prepare-build-assets --platform macos

      - name: Prepare asset (Linux)
        if: runner.os == 'Linux'
        run: python tools/ci/release_artifact_validation.py prepare-build-assets --platform linux

      # ── 7. GitHub Build Provenance Attestation (Sigstore / SLSA L2) ────────
      #    Generates a cryptographically signed attestation that this binary
      #    was built from THIS specific commit in THIS repository.
      #    Verifiable at: https://github.com/<owner>/<repo>/attestations
      - name: Attest Windows installer provenance
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45  # v2
        with:
          subject-path: builds/windows/Paracci-Setup-v*.exe

      - name: Attest Windows portable archive provenance
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45  # v2
        with:
          subject-path: builds/windows/Paracci-Portable-v*.zip

      # macOS temporarily disabled — runner hangs at pytest collection phase
      # - name: Attest macOS build provenance
      #   if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
      #   uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45  # v2
      #   with:
      #     subject-path: builds/macos/Paracci-macOS*
      # 
      # - name: Attest macOS DMG provenance
      #   if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
      #   uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45  # v2
      #   with:
      #     subject-path: builds/macos/Paracci-*-macOS.dmg

      - name: Attest Linux portable archive provenance
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45  # v2
        with:
          subject-path: builds/linux/Paracci-Linux.zip

      - name: Attest Linux AppImage provenance
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45  # v2
        with:
          subject-path: builds/linux/Paracci-*-x86_64.AppImage

      - name: Attest Linux Debian package provenance
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45  # v2
        with:
          subject-path: builds/linux/paracci_*_amd64.deb

      # ── 8. Upload artifacts ────────────────────────────────────────────────
      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: Paracci-Windows
          path: builds/windows/
          retention-days: 7

      # macOS temporarily disabled — runner hangs at pytest collection phase
      # - name: Upload artifact (macOS)
      #   if: runner.os == 'macOS'
      #   uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
      #   with:
      #     name: Paracci-macOS
      #     path: builds/macos/
      #     retention-days: 7

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: Paracci-Linux
          path: builds/linux/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 3 — Create GitHub Release
  # Runs only on version tags, after all builds succeed.
  # ═══════════════════════════════════════════════════════════════════════════
  release:
    name: Create Draft GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository metadata
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Download Windows artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: Paracci-Windows
          path: release-assets/windows

      # macOS temporarily disabled — runner hangs at pytest collection phase
      # - name: Download macOS artifact
      #   uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
      #   with:
      #     name: Paracci-macOS
      #     path: release-assets/macos

      - name: Download Linux artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: Paracci-Linux
          path: release-assets/linux

      # ── Resolve final file names ────────────────────────────────────────────
      - name: Resolve release files
        id: resolve
        shell: bash
        run: |
          python tools/ci/release_artifact_validation.py resolve-release-assets \
            --release-assets release-assets \
            --release-tag "$GITHUB_REF_NAME" \
            --github-output "$GITHUB_OUTPUT"

      - name: Generate canonical SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          python tools/ci/release_artifact_validation.py write-manifest \
            --manifest SHA256SUMS.txt \
            --file "${{ steps.resolve.outputs.win_setup_file }}" \
            --file "${{ steps.resolve.outputs.win_portable_file }}" \
            --file "${{ steps.resolve.outputs.linux_zip_file }}" \
            --file "${{ steps.resolve.outputs.linux_appimage_file }}" \
            --file "${{ steps.resolve.outputs.linux_deb_file }}" \
            --file "${{ steps.resolve.outputs.macos_file }}" \
            --file "${{ steps.resolve.outputs.macos_dmg_file }}"

      - name: Normalize filenames for VirusTotal
        run: |
          set -euo pipefail
          mkdir vt-scan
          cp "${{ steps.resolve.outputs.win_setup_file }}" vt-scan/Paracci-Windows-Setup.exe
          cp "${{ steps.resolve.outputs.win_portable_file }}" vt-scan/Paracci-Windows-Portable.zip
          cp "${{ steps.resolve.outputs.linux_zip_file }}" vt-scan/Paracci-Linux.zip
          cp "${{ steps.resolve.outputs.linux_appimage_file }}" vt-scan/Paracci-Linux.AppImage
          cp "${{ steps.resolve.outputs.linux_deb_file }}" vt-scan/Paracci-Linux.deb
          if [ -d "release-assets/macos" ]; then
            if ls release-assets/macos/Paracci-*-macOS.dmg >/dev/null 2>&1; then
              cp release-assets/macos/Paracci-*-macOS.dmg vt-scan/Paracci-macOS.dmg
            fi
            if [ -f "release-assets/macos/Paracci-macOS.zip" ]; then
              cp release-assets/macos/Paracci-macOS.zip vt-scan/Paracci-macOS-Compatibility.zip
            elif [ -f "release-assets/macos/Paracci-macOS" ]; then
              cp release-assets/macos/Paracci-macOS vt-scan/Paracci-macOS-Compatibility
            fi
          fi

      - name: VirusTotal Scan
        id: virustotal
        uses: crazy-max/ghaction-virustotal@d34968c958ae283fe976efed637081b9f9dcf74f  # v4
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          request_rate: 4
          files: |
            vt-scan/Paracci-Windows-Setup.exe
            vt-scan/Paracci-Windows-Portable.zip
            vt-scan/Paracci-macOS*
            vt-scan/Paracci-Linux.zip
            vt-scan/Paracci-Linux.AppImage
            vt-scan/Paracci-Linux.deb

      - name: Generate Release Body
        env:
          VT_ANALYSIS: ${{ steps.virustotal.outputs.analysis }}
          RELEASE_TAG: ${{ github.ref_name }}
          PACKAGE_VERSION: ${{ steps.resolve.outputs.package_version }}
        run: |
          python tools/ci/release_notes.py generate-body \
            --release-tag "$RELEASE_TAG" \
            --package-version "$PACKAGE_VERSION" \
            --repository "$GITHUB_REPOSITORY" \
            --release-assets release-assets \
            --output RELEASE_NOTE_BODY.md

      - name: Create GitHub Release
        id: gh_release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Paracci ${{ github.ref_name }}"
          draft: true
          prerelease: false
          generate_release_notes: false
          body_path: RELEASE_NOTE_BODY.md
          files: |
            ${{ steps.resolve.outputs.win_setup_file }}
            ${{ steps.resolve.outputs.win_portable_file }}
            ${{ steps.resolve.outputs.linux_zip_file }}
            ${{ steps.resolve.outputs.linux_appimage_file }}
            ${{ steps.resolve.outputs.linux_deb_file }}
            ${{ steps.resolve.outputs.macos_file }}
            ${{ steps.resolve.outputs.macos_dmg_file }}
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
